<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Janice SI</title>
  <meta name="description" content="Janice SI — Welcome to my art SI. AI art and videos.">
  <meta name="theme-color" content="#000000">
  <meta property="og:title" content="Janice SI">
  <meta property="og:description" content="Welcome to my art SI">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://janicejtt.github.io/Janice.SI/">
  <meta property="og:image" content="https://janicejtt.github.io/Janice.SI/assets/icons/og.jpg?v=2">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Janice SI">
  <meta name="twitter:description" content="Welcome to my art SI">
  <meta name="twitter:image" content="https://janicejtt.github.io/Janice.SI/assets/icons/og.jpg?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/icons/favicon-32.png?v=2" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/icons/icon512.png?v=2" type="image/png" sizes="512x512">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=2" sizes="180x180">
  <link rel="stylesheet" href="css/styles.css?v=20261028g">
</head>
<body>
  <div class="skip-links">
    <a class="skip-link" href="#feed">Skip to art</a>
  </div>

  <div class="page">
    <header class="profile">
      <h1>Janice.SI</h1>
      <div class="intro">
        <p>Hi, I'm Janice. I live for my art, where I can imagine everything that comes to my intuition</p>
        <p>As always, thank you for watching</p>
        <p>I love this space so much</p>
      </div>
    </header>

    <main id="feed" class="feed" aria-label="Art" tabindex="-1">
      <p id="feed-status" class="visually-hidden" role="status">Loading art…</p>
      <noscript>
        <p class="status">JavaScript is off, so the art feed can’t load.</p>
      </noscript>
      <div id="sentinel" aria-hidden="true"></div>
    </main>
  </div>

  <div id="viewer" class="viewer" hidden role="dialog" aria-modal="true" aria-label="Video">
    <div class="viewer-stage">
      <div class="viewer-reel"></div>
    </div>
    <div class="viewer-bottom">
        <div class="viewer-progress" role="slider" aria-label="Video position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
          <div class="viewer-progress-track">
            <div class="viewer-progress-buffer"></div>
            <div class="viewer-progress-fill"></div>
          </div>
        </div>
        <div class="viewer-bar">
          <div class="viewer-bar-group">
            <button type="button" class="viewer-play round-btn" aria-label="Pause">
              <svg class="icon-pause" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
                <path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M8.2 5.5v13M15.8 5.5v13"/>
              </svg>
              <svg class="icon-play" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
                <path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" d="M9 6.2 17.8 12 9 17.8Z"/>
              </svg>
            </button>
            <span class="viewer-time">-0:00</span>
          </div>
          <div class="viewer-bar-group">
            <button type="button" class="viewer-sound round-btn speaker-btn" aria-label="Mute" aria-pressed="true"></button>
          </div>
        </div>
    </div>
    <div class="viewer-chrome">
      <button type="button" class="viewer-back round-btn" aria-label="Back">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
          <path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M14.5 5.5 8 12l6.5 6.5"/>
        </svg>
      </button>
    </div>
  </div>

  <dialog id="lightbox" aria-modal="true">
    <button type="button" class="lightbox-close">Close</button>
    <figure class="lightbox-figure">
      <img id="lightbox-img" alt="">
      <figcaption id="lightbox-caption"></figcaption>
    </figure>
  </dialog>

  <script type="module" src="js/feed.js?v=20261028g"></script>
</body>
</html>
