<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Janice SI</title>
  <meta name="description" content="Janice SI — Hi nice to meet you all. AI art and videos.">
  <meta name="theme-color" content="#f6d5e4">
  <meta property="og:title" content="Janice SI">
  <meta property="og:description" content="Hi nice to meet you all 🫶🏻">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/janice-avatar.jpg">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/janice-avatar.jpg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="skip-links">
    <a class="skip-link" href="#feed">Skip to art</a>
    <a class="skip-link" href="#social-links" id="skip-social">Social links</a>
  </div>

  <div class="page">
    <header class="profile">
      <img
        class="avatar"
        src="assets/janice-avatar.jpg"
        alt="Portrait of Janice"
        width="840"
        height="840"
        fetchpriority="high"
        decoding="async"
      >
      <h1>Janice SI</h1>
      <p class="tagline">Hi nice to meet you all 🫶🏻</p>
    </header>

    <main id="feed" class="feed" aria-label="Art" tabindex="-1">
      <p id="feed-status" class="visually-hidden" role="status">Loading art…</p>
      <noscript>
        <style>#site-footer { display: block !important; }</style>
        <p class="status">JavaScript is off, so the art feed can’t load. The social links are at the bottom of the page.</p>
      </noscript>
      <div id="sentinel" aria-hidden="true"></div>
    </main>

    <!-- Social links: edit the hrefs here. -->
    <footer id="site-footer" class="site-footer" hidden>
      <p id="end-note" class="end-note" hidden>That’s everything for now.</p>
      <h2>Janice.SI</h2>
      <nav id="social-links" class="socials" aria-label="Social links" tabindex="-1">
        <a href="https://www.instagram.com/janicejt.art" target="_blank" rel="me noopener noreferrer">Instagram<span class="visually-hidden"> (opens in a new tab)</span></a>
        <a href="https://www.tiktok.com/@janice.jt" target="_blank" rel="me noopener noreferrer">TikTok<span class="visually-hidden"> (opens in a new tab)</span></a>
        <a href="https://www.youtube.com/@janicejt" target="_blank" rel="me noopener noreferrer">YouTube<span class="visually-hidden"> (opens in a new tab)</span></a>
        <a href="https://x.com/titlejt" target="_blank" rel="me noopener noreferrer">X<span class="visually-hidden"> (opens in a new tab)</span></a>
      </nav>
    </footer>
  </div>

  <dialog id="lightbox" aria-modal="true">
    <button type="button" class="lightbox-close">Close</button>
    <figure class="lightbox-figure">
      <img id="lightbox-img" alt="">
      <figcaption id="lightbox-caption"></figcaption>
    </figure>
  </dialog>

  <script type="module" src="js/feed.js"></script>
</body>
</html>
