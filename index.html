<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Janice SI</title>
  <meta name="description" content="Janice SI — Hi nice to meet you all. AI art and videos.">
  <meta name="theme-color" content="#0a0a0a">
  <meta property="og:title" content="Janice SI">
  <meta property="og:description" content="Hi nice to meet you all 🫶🏻">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/janice-avatar.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;900&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/janice-avatar.jpg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="skip-links">
    <a class="skip-link" href="#feed">Skip to art</a>
  </div>

  <div class="page">
    <header class="profile">
      <img
        class="avatar"
        src="assets/janice-avatar.jpg"
        alt="Portrait of Janice"
        width="1000"
        height="1000"
        fetchpriority="high"
        decoding="async"
      >
      <h1>Janice SI</h1>
      <p class="tagline">Hi nice to meet you all 🫶🏻</p>
    </header>

    <main id="feed" class="feed" aria-label="Art" tabindex="-1">
      <p id="feed-status" class="visually-hidden" role="status">Loading art…</p>
      <noscript>
        <p class="status">JavaScript is off, so the art feed can’t load.</p>
      </noscript>
      <div id="sentinel" aria-hidden="true"></div>
      <p id="end-note" class="end-note" hidden>That’s everything for now.</p>
    </main>
  </div>

  <dialog id="lightbox" aria-modal="true">
    <button type="button" class="lightbox-close">Close</button>
    <figure class="lightbox-figure">
      <img id="lightbox-img" alt="">
      <figcaption id="lightbox-caption"></figcaption>
    </figure>
  </dialog>

  <script type="module" src="js/feed.js"></script>
</body>
</html>
